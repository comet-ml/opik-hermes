name: Publish

run-name: "Publish opik-hermes (${{ github.event_name }}) by @${{ github.actor }}"

# Build + upload the package to PyPI when a GitHub Release is published by hand
# in the UI. release.yml is the normal path; this is the fallback, and the
# recovery path if release.yml's upload fails after its tag was pushed.
#
# Deliberately NOT workflow_call-able: PyPI Trusted Publishing does not support
# reusable workflows (pypi/warehouse#11096) — the OIDC exchange succeeds, then
# the upload 400s because the attestation certificate names the caller. The
# one-click release therefore does its own upload inside release.yml.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # required for PyPI Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The git tag (vX.Y.Z) and pyproject.toml's version must agree — the
      # wheel is built from pyproject, so a mismatch would tag one version
      # while `skip-existing` silently no-ops the upload of the
      # already-published one. Fail loudly instead.
      - name: Tag matches pyproject version
        env:
          REF: ${{ github.ref_name }}
        run: |
          FILE_VER=$(./scripts/pyproject-version.sh)
          TAG_VER="${REF#v}"
          if [ "$FILE_VER" != "$TAG_VER" ]; then
            echo "::error title=Version mismatch::Release tag v$TAG_VER != pyproject version $FILE_VER. Bump pyproject.toml to match the tag before publishing."
            exit 1
          fi
          echo "OK: tag v$TAG_VER matches pyproject version $FILE_VER"

      - name: Build sdist + wheel
        run: |
          pip install -U pip build
          python -m build --sdist --wheel --outdir dist/ .

      - name: Verify the plugin entry point loads (install wheel, then check)
        run: |
          pip install dist/*.whl
          python e2e/assert_entrypoint.py

      # skip-existing: a recovery run may follow a partial upload by release.yml.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          skip-existing: true
